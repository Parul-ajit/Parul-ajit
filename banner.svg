<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280"
     height="720"
     viewBox="0 0 1280 720">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0b0615">
<animate attributeName="stop-color"
values="#0b0615;#200833;#0b0615"
dur="10s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#34104d">
<animate attributeName="stop-color"
values="#34104d;#6a1b9a;#34104d"
dur="10s"
repeatCount="indefinite"/>
</stop>

</linearGradient>

<radialGradient id="pinkGlow">
<stop offset="0%" stop-color="#ff5fcf" stop-opacity=".45"/>
<stop offset="100%" stop-color="#ff5fcf" stop-opacity="0"/>
</radialGradient>

<radialGradient id="purpleGlow">
<stop offset="0%" stop-color="#7b2ff7" stop-opacity=".45"/>
<stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
</radialGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="40"/>
</filter>

<filter id="glass">
<feGaussianBlur stdDeviation="8"/>
</filter>

<style>

text{
font-family:'Segoe UI',sans-serif;
}

.name{
font-size:68px;
font-weight:800;
fill:white;
}

.role{
font-size:28px;
fill:#d6c8ff;
}

.tag{
font-size:20px;
fill:#b8b3d4;
}

.spark{
animation:float 5s ease-in-out infinite;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-20px);
}

100%{
transform:translateY(0px);
}

}

</style>

</defs>

<rect
width="1280"
height="720"
fill="url(#bg)"/>

<circle
cx="180"
cy="620"
r="220"
fill="url(#pinkGlow)"
filter="url(#blur)"/>

<circle
cx="1100"
cy="120"
r="240"
fill="url(#purpleGlow)"
filter="url(#blur)"/>

<circle
cx="980"
cy="600"
r="160"
fill="url(#pinkGlow)"
filter="url(#blur)"/>

<g opacity=".18">

<path
d="M0 650 L1280 650"
stroke="#ffffff"/>

<path
d="M0 600 L1280 600"
stroke="#ffffff"/>

<path
d="M0 550 L1280 550"
stroke="#ffffff"/>

<path
d="M0 500 L1280 500"
stroke="#ffffff"/>

</g>

<circle class="spark" cx="200" cy="140" r="4" fill="#ffffff"/>
<circle class="spark" cx="600" cy="100" r="3" fill="#ffffff"/>
<circle class="spark" cx="1100" cy="300" r="4" fill="#ffffff"/>
<circle class="spark" cx="900" cy="180" r="3" fill="#ffffff"/>
<circle class="spark" cx="420" cy="630" r="3" fill="#ffffff"/>

<text x="70" y="170" class="name">

PARUL AJIT

</text>

<text x="70" y="230" class="role">

WEB DEVELOPER

</text>

<text x="70" y="280" class="tag">

Building Ideas into Reality.

</text>
  <!-- ========================= -->
<!-- Glass Terminal Card -->
<!-- ========================= -->

<defs>

<linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff6ec7"/>
<stop offset="100%" stop-color="#7b2ff7"/>
</linearGradient>

</defs>

<!-- Glass Card -->

<rect
x="70"
y="340"
width="520"
height="250"
rx="25"
fill="rgba(255,255,255,0.05)"
stroke="url(#glassBorder)"
stroke-width="2"
opacity=".95"/>

<!-- Terminal Header -->

<rect
x="70"
y="340"
width="520"
height="45"
rx="25"
fill="#12061f"/>

<circle cx="100" cy="362" r="6" fill="#ff5f57"/>
<circle cx="122" cy="362" r="6" fill="#febc2e"/>
<circle cx="144" cy="362" r="6" fill="#28c840"/>

<text
x="170"
y="368"
fill="#d8c9ff"
font-size="16">

README.md

</text>

<!-- Prompt -->

<text
x="95"
y="420"
fill="#57ff8d"
font-size="20">

user@parul:~$

</text>

<!-- Typing -->

<text
x="235"
y="420"
fill="#ffffff"
font-size="20">

<tspan>

<animate
attributeName="textLength"
from="0"
to="210"
dur="4s"
repeatCount="indefinite"/>

Building Ideas into Reality.

</tspan>

</text>

<!-- Skills -->

<text
x="95"
y="470"
fill="#bda8ff"
font-size="18">

Java

</text>

<text
x="180"
y="470"
fill="#bda8ff"
font-size="18">

DSA

</text>

<text
x="250"
y="470"
fill="#bda8ff"
font-size="18">

React

</text>

<text
x="340"
y="470"
fill="#bda8ff"
font-size="18">

MongoDB

</text>

<text
x="95"
y="510"
fill="#ffffff"
font-size="18">

HTML

</text>

<text
x="180"
y="510"
fill="#ffffff"
font-size="18">

CSS

</text>

<text
x="250"
y="510"
fill="#ffffff"
font-size="18">

JavaScript

</text>

<text
x="400"
y="510"
fill="#ffffff"
font-size="18">

Bootstrap

</text>

<!-- Cursor -->

<rect
x="465"
y="404"
width="8"
height="22"
fill="#ff6ec7">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

<!-- Bottom Glow -->

<rect
x="70"
y="610"
width="520"
height="3"
fill="url(#glassBorder)">

<animate
attributeName="width"
values="0;520;0"
dur="5s"
repeatCount="indefinite"/>

</rect>
  <!-- ========================= -->
<!-- ANIME FRAME -->
<!-- ========================= -->

<defs>

<linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="50%" stop-color="#9b5cff"/>
    <stop offset="100%" stop-color="#5f7cff"/>

    <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 .5 .5"
        to="360 .5 .5"
        dur="8s"
        repeatCount="indefinite"/>
</linearGradient>

<filter id="frameGlow">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>

<clipPath id="avatarClip">
    <rect
        x="770"
        y="70"
        width="420"
        height="560"
        rx="30"/>
</clipPath>

</defs>

<!-- Glow -->

<rect
x="760"
y="60"
width="440"
height="580"
rx="35"
fill="#ff6ec7"
opacity=".08"
filter="url(#frameGlow)"/>

<!-- Border -->

<rect
x="770"
y="70"
width="420"
height="560"
rx="30"
fill="#14071f"
stroke="url(#frameBorder)"
stroke-width="3"
filter="url(#frameGlow)"/>

<!-- Character -->

<g clip-path="url(#avatarClip)">

<image
href="YOUR_IMAGE.png"
x="770"
y="70"
width="420"
height="560"
preserveAspectRatio="xMidYMid meet"/>

</g>

<!-- Scan Line -->

<rect
x="770"
y="70"
width="420"
height="8"
fill="#ff8de5"
opacity=".5">

<animate
attributeName="y"
values="70;620;70"
dur="5s"
repeatCount="indefinite"/>

</rect>

<!-- Corner Dots -->

<circle cx="790" cy="90" r="5" fill="#ff6ec7"/>
<circle cx="1170" cy="90" r="5" fill="#7b2ff7"/>
<circle cx="790" cy="610" r="5" fill="#7b2ff7"/>
<circle cx="1170" cy="610" r="5" fill="#ff6ec7"/>

<!-- Floating Sparkles -->

<g>

<circle cx="735" cy="120" r="3" fill="#ffffff">
<animate attributeName="cy" values="120;90;120" dur="3s" repeatCount="indefinite"/>
</circle>

<circle cx="1220" cy="200" r="2" fill="#ffffff">
<animate attributeName="cy" values="200;170;200" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="1210" cy="560" r="3" fill="#ffffff">
<animate attributeName="cy" values="560;530;560" dur="5s" repeatCount="indefinite"/>
</circle>

<circle cx="740" cy="500" r="2" fill="#ffffff">
<animate attributeName="cy" values="500;470;500" dur="3.5s" repeatCount="indefinite"/>
</circle>

</g>
  <!-- ========================= -->
<!-- FLOATING TECH ICONS -->
<!-- ========================= -->

<defs>

<linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff6ec7"/>
<stop offset="100%" stop-color="#7b2ff7"/>
</linearGradient>

<linearGradient id="footerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ff6ec7"/>
<stop offset="50%" stop-color="#9b5cff"/>
<stop offset="100%" stop-color="#6f7dff"/>
</linearGradient>

</defs>

<!-- JAVA -->

<g>

<circle cx="680" cy="130" r="26" fill="url(#iconBg)">
<animate attributeName="cy"
values="130;115;130"
dur="4s"
repeatCount="indefinite"/>
</circle>

<text
x="662"
y="137"
font-size="15"
fill="white"
font-weight="700">

JAVA

</text>

</g>

<!-- REACT -->

<g>

<circle cx="1160" cy="210" r="28" fill="url(#iconBg)">
<animate attributeName="cy"
values="210;190;210"
dur="5s"
repeatCount="indefinite"/>
</circle>

<text
x="1136"
y="217"
font-size="13"
fill="white"
font-weight="700">

REACT

</text>

</g>

<!-- HTML -->

<g>

<circle cx="700" cy="590" r="24" fill="url(#iconBg)">
<animate attributeName="cy"
values="590;570;590"
dur="4.5s"
repeatCount="indefinite"/>
</circle>

<text
x="682"
y="596"
font-size="14"
fill="white"
font-weight="700">

HTML

</text>

</g>

<!-- CSS -->

<g>

<circle cx="1185" cy="500" r="24" fill="url(#iconBg)">
<animate attributeName="cy"
values="500;480;500"
dur="5s"
repeatCount="indefinite"/>
</circle>

<text
x="1171"
y="506"
font-size="14"
fill="white"
font-weight="700">

CSS

</text>

</g>

<!-- JS -->

<g>

<circle cx="1240" cy="350" r="22" fill="url(#iconBg)">
<animate attributeName="cy"
values="350;330;350"
dur="3.8s"
repeatCount="indefinite"/>
</circle>

<text
x="1232"
y="356"
font-size="14"
fill="white"
font-weight="700">

JS

</text>

</g>

<!-- ========================= -->
<!-- AURORA -->
<!-- ========================= -->

<ellipse
cx="620"
cy="-50"
rx="600"
ry="160"
fill="#8e4dff"
opacity=".08">

<animate
attributeName="opacity"
values=".05;.15;.05"
dur="8s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="980"
cy="760"
rx="500"
ry="140"
fill="#ff6ec7"
opacity=".06">

<animate
attributeName="opacity"
values=".04;.12;.04"
dur="7s"
repeatCount="indefinite"/>

</ellipse>

<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<rect
x="0"
y="712"
width="1280"
height="8"
fill="url(#footerGlow)">

<animate
attributeName="opacity"
values=".4;1;.4"
dur="3s"
repeatCount="indefinite"/>

</rect>

<text
x="640"
y="695"
text-anchor="middle"
font-size="18"
fill="#d7c8ff">

Building Ideas into Reality • Java • React • MongoDB

</text>

<!-- ========================= -->
<!-- END -->
<!-- ========================= -->

</svg>
